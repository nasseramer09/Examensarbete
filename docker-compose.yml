version: '3.12'

services:
  web:
    build: 
    ports:
      -"5000:5000"
    depends_on:
      - db
  
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root 
      MYSQL_DATABASE: mydb
      MYSQL_USER: user 
      MYSQL_PASSWORD: password 
    ports:
      - "3306:3306"

